server {
    listen 80;
    server_name phillyfaithful.com www.phillyfaithful.com;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    # Redirect www to non-www
    if ($host = www.phillyfaithful.com) {
        return 301 https://phillyfaithful.com$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # WordPress admin
    location /wp-admin {
        try_files $uri $uri/ /wp-admin/index.php?$args;
    }

    # Pass PHP scripts to WordPress container (php-fpm)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny access to sensitive files
    location ~ /\.(ht|git) {
        deny all;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        log_not_found off;
        access_log off;
    }

    # Deny direct access to wp-config.php
    location = /wp-config.php {
        deny all;
    }

    # Block xmlrpc.php to prevent brute force
    location = /xmlrpc.php {
        deny all;
    }
}
